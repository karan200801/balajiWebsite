<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#650e08">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Balaji Orders — Shop Dashboard</title>
<!--
  BALAJI PAUVA HOUSE · SHOP DASHBOARD (staff only)
  Live order board for the kitchen / counter. Orders placed on the website
  appear here instantly (Firestore realtime). Staff accept, cook, mark ready,
  deliver, verify UPI payments, and see customer records.
  Login: Firebase email + password account that is listed in the
  Firestore collection "admins" (document id = the email). See SETUP-ORDER-SYSTEM.md
-->
<style>
:root{--maroon:#650e08;--deep:#4c0603;--orange:#f58320;--cream:#fff4e5;--frame:#ffebc9;--brown:#60391e;--muted:#81674f;--line:#e2cdb4;--page:#f6efe4;--card:#fff;--green:#1fa855;--green-d:#15823f;--red:#c0392b;--blue:#2b5ea7;--amber:#b86b00;--shadow:0 8px 24px #653a1314}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;background:var(--page);color:var(--brown);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--maroon)}
[hidden]{display:none!important}
svg{width:18px;height:18px;flex:0 0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--maroon);color:#ffe9cd;display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:0 4px 18px #3a120540;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px;font-size:17px}
.brand img{width:34px;height:34px;border-radius:9px;background:#fff}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.75;letter-spacing:.8px;text-transform:uppercase}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:#9aa;box-shadow:0 0 0 3px #ffffff22}
.dot.on{background:#3ddc84;animation:pulse 1.6s infinite}
.dot.off{background:#ff6b6b}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px #3ddc8433}50%{box-shadow:0 0 0 6px #3ddc8411}}
.tb-btn{display:inline-flex;align-items:center;gap:6px;background:#ffffff1a;color:#ffe9cd;border:1px solid #ffffff2a;border-radius:11px;padding:7px 11px;font-size:13px;font-weight:600;min-height:36px}
.tb-btn:hover{background:#ffffff2e}
.tb-btn.alert{background:#ff9f1c;color:#3a1200;border-color:#ff9f1c}
.tb-btn select{background:transparent;border:0;color:inherit;font-weight:600;outline:0}
.tb-btn select option{color:#222}
.tb-mobile{display:none}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600}
.switch i{width:38px;height:22px;border-radius:22px;background:#ffffff33;position:relative;transition:.2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch input:checked+i{background:#3ddc84}
.switch input:checked+i::after{left:19px}

/* ---------- nav tabs ---------- */
.tabs{display:flex;gap:4px;padding:8px 10px 0;background:var(--maroon);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;color:#ffd8ac;padding:9px 14px 11px;border-radius:12px 12px 0 0;font-weight:700;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tabs button.on{background:var(--page);color:var(--maroon)}
.tabs .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#ff9f1c;color:#3a1200;font-size:12px;display:grid;place-items:center;font-weight:800}
.tabs button.on .cnt{background:var(--maroon);color:#ffe9cd}

main{padding:14px;max-width:1500px;margin:0 auto}

/* ---------- login ---------- */
.login-wrap{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:20px}
.login{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow)}
.login h1{font-size:22px;color:var(--maroon);margin-bottom:4px}
.login p{color:var(--muted);font-size:14px;margin-bottom:18px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:13px;padding:10px 13px;background:#fff;outline:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f5832030}
.f textarea{min-height:80px;resize:vertical}
.msg{display:none;padding:10px 12px;border-radius:11px;font-size:13.5px;margin:6px 0 12px}
.msg.show{display:block}
.msg.err{background:#fdecea;border:1px solid #f2b8b0;color:#8f2214}
.msg.ok{background:#e8f5ea;border:1px solid #b9dfc1;color:#1f6b31}
.msg.info{background:#fff3d9;border:1px solid #dcbc8d;color:#6d5138}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--brown);transition:transform .12s,background .15s;white-space:nowrap}
.btn:hover{background:var(--frame)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.p{background:var(--maroon);border-color:var(--maroon);color:#ffe9cd}
.btn.p:hover{background:#7d1a0a}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.g:hover{background:var(--green-d)}
.btn.o{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.o:hover{background:#d96f12}
.btn.b{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.d{color:var(--red);border-color:#f3bcbc}
.btn.d:hover{background:#fdecea}
.btn.sm{min-height:32px;padding:4px 10px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%}
.btn .spin{width:16px;height:16px;border-radius:50%;border:2.5px solid #ffffff55;border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;color:var(--maroon);line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.stat.warn b{color:var(--amber)}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.board{grid-template-columns:1fr}}
.col{background:#efe4d3;border-radius:18px;padding:10px;min-height:120px}
.col h2{display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:4px 6px 10px}
.col h2 .cnt{margin-left:auto;background:#fff;border-radius:10px;padding:1px 9px;font-size:13px;color:var(--maroon)}
.col.new{background:#fde9d5}
.col.new h2{color:#b45309}
.col.cook{background:#fff1c7}
.col.ready{background:#dff3e3}
.col.done{background:#ebe6df}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 6px}

/* ---------- order card ---------- */
.oc{background:var(--card);border-radius:16px;padding:12px 13px;margin-bottom:10px;border:1px solid #0000000d;box-shadow:0 4px 14px #4a200a10;position:relative;overflow:hidden}
.oc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--muted)}
.oc.s-received::before{background:var(--orange)}
.oc.s-confirmed::before,.oc.s-preparing::before{background:#e0a800}
.oc.s-ready::before,.oc.s-out::before{background:var(--green)}
.oc.s-completed::before{background:#9aa}
.oc.s-cancelled::before{background:var(--red)}
.oc.is-new{animation:flash 1.2s ease-in-out 4}
@keyframes flash{0%,100%{box-shadow:0 4px 14px #4a200a10}50%{box-shadow:0 0 0 4px #f5832088}}
.oc-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.oc-id{font-size:22px;font-weight:900;color:var(--maroon);letter-spacing:.5px}
.oc-id small{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:4px}
.oc-time{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right}
.oc-time b{display:block;color:var(--brown)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.3px;padding:3px 9px;border-radius:99px;background:#f3eadb;border:1px solid #e6d6bf;color:#7e654f;text-transform:uppercase}
.chip svg{width:12px;height:12px}
.chip.delivery{background:#e8f3ea;border-color:#c4dfc9;color:#2e6b3a}
.chip.pickup{background:#eaf0f8;border-color:#c5d5ea;color:#33567e}
.chip.paid{background:#e8f3ea;border-color:#c4dfc9;color:#1f6b31}
.chip.due{background:#fdeeee;border-color:#f3bcbc;color:#9c2a1e}
.chip.claim{background:#fff3d9;border-color:#dcbc8d;color:#8a5a00}
.chip.cod{background:#f7f1e6;border-color:#e4d3b8;color:#6d5138}
.chip.live{background:#fdeecf;border-color:#f3c98a;color:#96590a}
.chip.live i{width:7px;height:7px;border-radius:50%;background:var(--orange);animation:pulse 1.2s infinite}
.chip.st{background:var(--maroon);border-color:var(--maroon);color:#ffe9cd}
.chip.cancel{background:#fdeeee;border-color:#f3bcbc;color:#9c2a1e}
.cust{font-size:14px;margin:4px 0 8px;line-height:1.5}
.cust b{font-size:15px}
.cust a{font-weight:700;text-decoration:none}
.cust .addr{color:var(--muted);font-size:13px}
.cust .addr a{font-weight:600;margin-left:4px}
.items{list-style:none;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:6px 0;margin:6px 0}
.items li{display:flex;gap:8px;padding:3px 0;font-size:14.5px}
.items li b{min-width:30px;color:var(--maroon)}
.items li span{margin-left:auto;color:var(--muted);font-size:13px}
.note svg{width:14px;height:14px;vertical-align:-2px}
.col h2 svg{width:16px;height:16px}
.cust .addr svg{width:13px;height:13px;vertical-align:-2px}
.eta svg{width:14px;height:14px}
.note{background:#fff8dc;border:1px dashed #e8c96a;color:#6b4a00;border-radius:10px;padding:7px 10px;font-size:13.5px;margin:6px 0}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--muted);margin:6px 0 8px;flex-wrap:wrap}
.tot b{font-size:21px;color:var(--maroon)}
.utr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:#f6f1e8;border-radius:7px;padding:2px 7px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts .btn{flex:1 1 auto}
.eta{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:8px}
.eta select{border:1.5px solid var(--line);border-radius:8px;padding:3px 6px;background:#fff;font-size:12.5px}
.tl{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.tl b{color:var(--brown);font-weight:600}
.more{color:var(--maroon);font-weight:700;font-size:12.5px;background:none;text-decoration:underline}

/* ---------- lists (history / customers) ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{min-height:40px;border:1.5px solid var(--line);border-radius:12px;padding:7px 12px;background:#fff;outline:0}
.toolbar input:focus,.toolbar select:focus{border-color:var(--orange)}
.toolbar .grow{flex:1 1 200px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.row:hover{transform:translateY(-1px)}
.row h3{font-size:16px;color:var(--maroon);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.row h3 small{color:var(--muted);font-size:12.5px;font-weight:600;margin-left:auto}
.row p{font-size:13.5px;color:var(--muted);margin-top:3px}
.row .kv{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.row .kv b{color:var(--brown)}
.pager{text-align:center;margin:16px 0}

/* ---------- settings ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:17px;color:var(--maroon);margin-bottom:4px}
.card>p{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
.qr-prev{width:180px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px}
.qr-prev svg{display:block;width:100%;height:auto}
.admins li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.admins li:last-child{border:0}
.admins li span{margin-left:auto}
code{background:#f3eadb;border-radius:6px;padding:1px 6px;font-size:13px}

/* ---------- modal ---------- */
dialog{border:0;padding:0;background:transparent;max-width:min(560px,94vw);width:100%}
dialog::backdrop{background:#2b0f04b0;backdrop-filter:blur(3px)}
.modal{background:var(--page);border-radius:20px;padding:18px;max-height:88vh;overflow:auto;box-shadow:0 30px 70px #3a120540}
.modal h2{font-size:19px;color:var(--maroon);display:flex;align-items:center;gap:10px}
.modal h2 button{margin-left:auto}
.modal .sub{color:var(--muted);font-size:13.5px;margin:2px 0 12px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2b1a0e;color:#ffe9cd;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 12px 30px #0006;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.banner{background:#fff3d9;border:1px solid #dcbc8d;color:#6d5138;border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.red{background:#fdecea;border-color:#f2b8b0;color:#8f2214}
.banner .btn{margin-left:auto}
@media (max-width:700px){.topbar{padding:8px 10px;gap:6px}.brand{font-size:15px}.brand img{width:28px;height:28px}.tb-btn{padding:5px 9px;font-size:12px;min-height:32px;border-radius:9px}.tb-label{display:none}.tb-mobile{display:inline}.tabs button{padding:8px 11px 10px;font-size:13px}main{padding:10px}.stats{gap:8px}.stat{padding:10px 12px}.stat b{font-size:20px}}
@media print{body>*{display:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="/icons/icon-192.png" alt=""><div>Balaji Orders<small>Shop dashboard</small></div></div>
  <div class="tb-right" id="tb-right" hidden>
    <span class="tb-btn" title="Connection"><span class="dot" id="conn-dot"></span><span id="conn-text" class="tb-label">Connecting…</span></span>
    <label class="tb-btn"><span class="tb-label">Outlet</span><select id="outlet-filter"><option value="all">All outlets</option></select></label>
    <label class="switch tb-btn" title="Accept online orders"><input type="checkbox" id="accepting"><i></i><span><span class="tb-label">Accepting orders</span><span class="tb-mobile">Online</span></span></label>
    <button class="tb-btn" id="sound-btn" type="button" title="New order sound">Sound</button>
    <button class="tb-btn" id="logout-btn" type="button">Log out</button>
  </div>
</header>
<nav class="tabs" id="tabs" hidden>
  <button data-view="live" class="on">Live orders <span class="cnt" id="cnt-new" hidden>0</span></button>
  <button data-view="history">All orders</button>
  <button data-view="customers">Customers</button>
  <button data-view="enquiries">Franchise enquiries</button>
  <button data-view="settings">Settings</button>
</nav>
<main id="main"></main>
<dialog id="modal"><div class="modal" id="modal-body"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<audio id="ding" preload="auto" hidden></audio>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, connectAuthEmulator } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, query, where, orderBy, limit, startAfter, onSnapshot, connectFirestoreEmulator } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ───────── config (same project as the website) ───────── */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCkbINUf6AtFovRrdU-3i56t2_PVaxaZwk",
  authDomain: "balaji-pauva-house.firebaseapp.com",
  projectId: "balaji-pauva-house",
  storageBucket: "balaji-pauva-house.firebasestorage.app",
  messagingSenderId: "80949415947",
  appId: "1:80949415947:web:07686be218954fbc82370e"
};
const OUTLETS = ['C.T.M. Cross Road', 'New Maninagar', 'Vastral', 'Maninagar'];

const STATUS_LABEL = { received: 'New', confirmed: 'Accepted', preparing: 'Cooking', ready: 'Ready', out: 'Out for delivery', completed: 'Completed', cancelled: 'Cancelled' };

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);
/* local developer testing only: Firebase emulators when localStorage bph-emulator is set (never in production) */
try { const emu = localStorage.getItem('bph-emulator'); if (emu) { const h = emu.split(':')[0] || '127.0.0.1'; connectFirestoreEmulator(db, h, 8080); connectAuthEmulator(auth, 'http://' + h + ':9099', { disableWarnings: true }); } } catch (_) {}

/* ───────── helpers ───────── */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '₹' + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-IN');
const pad = n => String(n).padStart(2, '0');
const clock = ts => { if (!ts) return '—'; const d = new Date(ts); let h = d.getHours() % 12 || 12; return h + ':' + pad(d.getMinutes()) + (d.getHours() >= 12 ? ' PM' : ' AM'); };
const dateStr = ts => { const d = new Date(ts); return pad(d.getDate()) + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getFullYear(); };
const ago = ts => { const m = Math.floor((Date.now() - ts) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.floor(m / 60); if (h < 24) return h + ' hr ago'; return dateStr(ts); };
const shortId = id => String(id || '').split('-').pop();
const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fmtPhone = p => { const s = String(p || '').replace(/\D/g, '').slice(-10); return s.length === 10 ? s.slice(0, 5) + ' ' + s.slice(5) : (p || ''); };
const mapsLink = a => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a);
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); };
const I = {

/* ───────── sound / notifications ───────── */
let actx = null;
function beep(n = 2) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    for (let i = 0; i < n; i++) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(i % 2 ? 660 : 880, t0 + i * .32);
      g.gain.setValueAtTime(.0001, t0 + i * .32);
      g.gain.exponentialRampToValueAtTime(.5, t0 + i * .32 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + i * .32 + .3);
      o.connect(g).connect(actx.destination); o.start(t0 + i * .32); o.stop(t0 + i * .32 + .32);
    }
  } catch (_) {}
}
function notify(o) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const items = (o.items || []).map(i => i.qty + '× ' + i.name).join(', ');
    const n = new Notification('New order #' + shortId(o.id) + ' · ' + money(o.total), { body: (o.mode === 'pickup' ? 'Pickup · ' : 'Delivery · ') + (o.outlet || '') + '\n' + items, tag: o.id, icon: '/icons/icon-192.png' });
    n.onclick = () => { window.focus(); n.close(); };
  } catch (_) {}
}

let adminCheckError = '';
async function checkAdmin(u) {
  adminCheckError = '';
  const emails = [...new Set([u.email || '', (u.email || '').toLowerCase()])].filter(Boolean);
  for (const e of emails) {
    try { const s = await getDoc(doc(db, 'admins', e)); if (s.exists()) return true; }
    catch (err) { adminCheckError = (err && err.code) || 'error'; }
  }
  /* Owner bootstrap: the security rules list the owner email(s) as always-admin. For such a login the
     rules allow writing /admins, so we create the owner's own staff record here — no console work needed.
     For anyone else this write is refused by the rules and they stay locked out. */
  try {
    const em = (u.email || '').toLowerCase();
    if (em) { await setDoc(doc(db, 'admins', em), { role: 'owner', addedAt: Date.now(), addedBy: 'owner-bootstrap' }, { merge: true }); adminCheckError = ''; return true; }
  } catch (_) {}

}

/* ───────── live listeners ───────── */
function stopListeners() { S.unsubs.forEach(u => { try { u(); } catch (_) {} }); S.unsubs = []; S.orders.clear(); S.seen.clear(); S.booted = false; }
function startListeners() {
  stopListeners();
  const since = Date.now() - 36 * 3600e3;
  const q1 = query(collection(db, 'orders'), where('placedAt', '>=', since));
  const q2 = query(collection(db, 'orders'), where('status', 'in', ACTIVE));
  const onErr = e => { setConn(false, e && e.code === 'permission-denied' ? 'No permission — publish firestore.rules' : 'Connection error'); console.warn(e); };
  let first1 = true;
  S.unsubs.push(onSnapshot(q1, snap => {
    snap.docChanges().forEach(ch => {
      const o = ch.doc.data(); o._id = ch.doc.id;
      if (ch.type === 'removed') { S.orders.delete(o._id); return; }
      const fresh = !S.seen.has(o._id);
      S.orders.set(o._id, o); S.seen.add(o._id);
      if (fresh && S.booted && o.status === 'received') { S.newIds.add(o._id); beep(3); notify(o); toast('New order #' + shortId(o.id) + ' · ' + money(o.total)); }
    });
    if (first1) { first1 = false; S.booted = true; }
    setConn(true); renderIfLive();
  }, onErr));
  S.unsubs.push(onSnapshot(q2, snap => {
    snap.docChanges().forEach(ch => {
      const o = ch.doc.data(); o._id = ch.doc.id;
      if (ch.type === 'removed') { const cur = S.orders.get(o._id); if (cur && (cur.placedAt || 0) < since) S.orders.delete(o._id); return; }
      S.orders.set(o._id, o); S.seen.add(o._id);
    });
    renderIfLive();
  }, onErr));
  S.unsubs.push(onSnapshot(doc(db, 'settings', 'store'), snap => {
    S.settings = snap.exists() ? snap.data() : {};
    $('#accepting').checked = S.settings.acceptingOrders !== false;
    if (S.view === 'settings') renderSettings();
  }, () => {}));
}

const outletOk = o => S.outlet === 'all' || (o.outlet || '') === S.outlet;

/* ───────── order actions ───────── */
async function patch(o, data, okMsg) {
  try { await updateDoc(doc(db, 'orders', o._id || o.id), Object.assign({ updatedAt: Date.now(), lastActionBy: S.user.email }, data)); if (okMsg) toast(okMsg); return true; }
  catch (err) { toast('Failed: ' + (err.code === 'permission-denied' ? 'no permission (publish firestore.rules)' : err.message)); return false; }
}
const ACTIONS = {
  accept: o => patch(o, { status: 'preparing', confirmedAt: Date.now(), preparingAt: Date.now() }, 'Accepted — cooking #' + shortId(o.id)),
  ready: o => patch(o, { status: 'ready', readyAt: Date.now() }, '#' + shortId(o.id) + ' marked ready'),
  out: o => patch(o, { status: 'out', outAt: Date.now() }, '#' + shortId(o.id) + ' out for delivery'),
  complete: o => {
    const d = { status: 'completed', completedAt: Date.now() };
    if ((o.payment || {}).method !== 'upi' && (o.payment || {}).status !== 'paid') { d['payment.status'] = 'paid'; d['payment.paidAt'] = Date.now(); d['payment.via'] = 'cash'; }
    return patch(o, d, '#' + shortId(o.id) + ' completed');
  },
  paid: o => patch(o, { 'payment.status': 'paid', 'payment.paidAt': Date.now(), 'payment.verifiedBy': S.user.email, 'payment.via': (o.payment || {}).method === 'upi' ? 'upi' : 'cash' }, 'Payment marked PAID for #' + shortId(o.id)),
  unpaid: o => patch(o, { 'payment.status': 'pending', 'payment.paidAt': null, 'payment.verifiedBy': null }, 'Payment reset to pending'),
  cancel: async o => {
    const r = prompt('Cancel / reject order #' + shortId(o.id) + '?\nReason shown to the customer:', 'Item not available right now');
    if (r === null) return;
    return patch(o, { status: 'cancelled', cancelReason: r || 'Cancelled by the shop', cancelledAt: Date.now(), cancelledBy: 'shop' }, 'Order cancelled');
  },
  eta: (o, v) => patch(o, { eta: Number(v) || 18 }),
  del: async o => {
    if (!confirm('Permanently delete order ' + o.id + '? This cannot be undone.')) return;
    try { await deleteDoc(doc(db, 'orders', o._id || o.id)); S.orders.delete(o._id || o.id); S.history = S.history.filter(x => x._id !== (o._id || o.id)); toast('Deleted'); setView(S.view); } catch (err) { toast('Failed: ' + err.message); }
  },
  print: o => printOrder(o)
};
document.addEventListener('click', async e => {

/* ───────── rendering: order card ───────── */
function payChip(o) {
  const p = o.payment || { method: 'cod', status: 'pending' };
  if (p.method === 'upi') {
    if (p.status === 'paid') return `<span class="chip paid">${I.check}UPI paid</span>`;
    if (p.status === 'claimed') return `<span class="chip claim">UPI · customer says paid</span>`;
    return `<span class="chip due">UPI · NOT PAID</span>`;
  }
  if (p.status === 'paid') return `<span class="chip paid">${I.check}Cash received</span>`;
  return `<span class="chip cod">${o.mode === 'pickup' ? 'Pay at counter' : 'COD · collect ' + money(o.total)}</span>`;
}
function actionButtons(o) {
  const s = o.status, p = o.payment || {}, A = [];
  const btn = (act, cls, label, icon = '') => `<button class="btn ${cls}" data-act="${act}" data-id="${esc(o._id)}">${icon}${label}</button>`;
  if (s === 'received') { A.push(btn('accept', 'g', 'Accept & start cooking', I.check)); A.push(btn('cancel', 'd', 'Reject', I.x)); }
  else if (s === 'confirmed' || s === 'preparing') {
    if (o.mode === 'pickup') A.push(btn('ready', 'g', 'Ready for pickup', I.bag));
    else { A.push(btn('ready', 'o', 'Packed', I.bag)); A.push(btn('out', 'g', 'Out for delivery', I.bike)); }
  }
  else if (s === 'ready') { A.push(o.mode === 'pickup' ? btn('complete', 'g', 'Collected ✓') : btn('out', 'g', 'Out for delivery', I.bike)); }
  else if (s === 'out') { A.push(btn('complete', 'g', 'Delivered ✓')); }
  if (ACTIVE.includes(s) && s !== 'received') A.push(btn('cancel', 'd sm', 'Cancel', I.x));
  if (p.method === 'upi' && p.status !== 'paid' && s !== 'cancelled') A.push(btn('paid', 'b', p.status === 'claimed' ? 'Verify ✓ mark paid' : 'Mark paid', I.rupee));
  else if (p.status === 'paid' && ACTIVE.includes(s)) A.push(btn('unpaid', 'sm', 'Undo paid'));
  else if (p.method !== 'upi' && p.status !== 'paid' && ACTIVE.includes(s) && s !== 'received') A.push(btn('paid', 'sm', 'Cash received', I.rupee));
  A.push(btn('print', 'sm', 'Print', I.print));
  if (s === 'completed' || s === 'cancelled') A.push(btn('del', 'd sm', '', I.trash));
  return A.join('');
}
function orderCard(o, opts = {}) {
  const p = o.payment || {};
  const items = (o.items || []).map(i => `<li><b>${esc(i.qty)}×</b>${esc(i.name)}<span>${money((i.price || 0) * i.qty)}</span></li>`).join('');
  const tl = [['Placed', o.placedAt], ['Accepted', o.confirmedAt], ['Ready', o.readyAt], ['Out', o.outAt], ['Done', o.completedAt], ['Cancelled', o.cancelledAt], ['Paid', p.paidAt]]
    .filter(x => x[1]).map(x => `<b>${x[0]}</b> ${clock(x[1])}`).join(' → ');
  const isNew = S.newIds.has(o._id);
  return `<article class="oc s-${esc(o.status)}${isNew ? ' is-new' : ''}" data-oid="${esc(o._id)}">
    <div class="oc-head"><span class="oc-id">#${esc(shortId(o.id))}<small>${esc(o.id)}</small></span>
      <span class="oc-time"><b>${clock(o.placedAt)}</b>${ago(o.placedAt)}${opts.date ? ' · ' + dateStr(o.placedAt) : ''}</span></div>
    <div class="chips">

/* ───────── view: live board ───────── */
function renderLive() {
  updateNewCount();
  const all = [...S.orders.values()].filter(outletOk).sort((a, b) => (a.placedAt || 0) - (b.placedAt || 0));
  const today = startOfToday();
  const col = (title, cls, list, newestFirst) => {
    const arr = newestFirst ? [...list].reverse() : list;
    return `<section class="col ${cls}"><h2>${title}<span class="cnt">${arr.length}</span></h2>${arr.length ? arr.map(o => orderCard(o)).join('') : '<p class="empty">Nothing here</p>'}</section>`;
  };
  const neu = all.filter(o => o.status === 'received');
  const cook = all.filter(o => o.status === 'confirmed' || o.status === 'preparing');
  const ready = all.filter(o => o.status === 'ready' || o.status === 'out');
  const done = all.filter(o => (o.status === 'completed' || o.status === 'cancelled') && (o.placedAt || 0) >= today);
  const todays = all.filter(o => (o.placedAt || 0) >= today);
  const sales = todays.filter(o => o.status !== 'cancelled').reduce((s, o) => s + (Number(o.total) || 0), 0);
  const pendingPay = all.filter(o => ACTIVE.includes(o.status) && (o.payment || {}).method === 'upi' && (o.payment || {}).status !== 'paid').length;
  const claims = all.filter(o => (o.payment || {}).status === 'claimed').length;
  $('#main').innerHTML = `
    ${S.settings.acceptingOrders === false ? '<div class="banner red"><b>PAUSED:</b> Online ordering is off — customers see “Online orders paused”. Switch it back on in the top bar.</div>' : ''}
    <div class="stats">
      <div class="stat"><b>${todays.filter(o => o.status !== 'cancelled').length}</b><span>Orders today</span></div>
      <div class="stat"><b>${money(sales)}</b><span>Sales today</span></div>
      <div class="stat ${neu.length ? 'warn' : ''}"><b>${neu.length}</b><span>Waiting to accept</span></div>
      <div class="stat ${claims ? 'warn' : ''}"><b>${claims}</b><span>UPI to verify</span></div>
      <div class="stat"><b>${pendingPay}</b><span>UPI unpaid (active)</span></div>
    </div>
    <div class="board">
      ${col(I.bell + ' New', 'new', neu)}

      ${col(I.bike + ' Ready / on the way', 'ready', ready)}
      ${col(I.box + ' Done today', 'done', done, true)}
    </div>`;
  S.newIds.clear();
}

/* ───────── view: history ───────── */
async function loadHistory(reset) {
  if (reset) { S.history = []; S.histCursor = null; S.histDone = false; }
  if (S.histDone) return;
  let q;
  const from = S.histFrom ? new Date(S.histFrom + 'T00:00:00').getTime() : null;
  const to = S.histTo ? new Date(S.histTo + 'T23:59:59.999').getTime() : null;
  const parts = [collection(db, 'orders')];
  if (from) parts.push(where('placedAt', '>=', from));
  if (to) parts.push(where('placedAt', '<=', to));
  parts.push(orderBy('placedAt', 'desc'));
  if (S.histCursor != null) parts.push(startAfter(S.histCursor));
  parts.push(limit(150));
  q = query(...parts);
  try {
    const snap = await getDocs(q);
    snap.forEach(d => { const o = d.data(); o._id = d.id; S.history.push(o); });
    if (snap.size < 150) S.histDone = true;
    if (snap.size) S.histCursor = snap.docs[snap.docs.length - 1].data().placedAt;
  } catch (err) { toast('Could not load: ' + (err.code || err.message)); S.histDone = true; }
}
function histFiltered() {
  const q = S.histQ.trim().toLowerCase();
  return S.history.filter(o => outletOk(o) && (S.histStatus === 'all' || o.status === S.histStatus || (S.histStatus === 'unpaid' && (o.payment || {}).status !== 'paid' && o.status !== 'cancelled'))
    && (!q || [o.id, o.name, o.phone, o.address, (o.payment || {}).utr].join(' ').toLowerCase().includes(q)));
}
async function renderHistory() {
  const m = $('#main');
  if (!S.history.length && !S.histDone) { m.innerHTML = '<p class="empty">Loading orders…</p>'; await loadHistory(true); if (S.view !== 'history') return; }
  const list = histFiltered();
  const sales = list.filter(o => o.status !== 'cancelled').reduce((s, o) => s + (Number(o.total) || 0), 0);
  m.innerHTML = `
    <div class="toolbar">
      <input class="grow" id="h-q" placeholder="Search order id, name, phone, UTR…" value="${esc(S.histQ)}">
      <select id="h-status">${['all', 'received', 'preparing', 'ready', 'out', 'completed', 'cancelled', 'unpaid'].map(s => `<option value="${s}"${S.histStatus === s ? ' selected' : ''}>${s === 'all' ? 'All statuses' : s === 'unpaid' ? 'Payment pending' : STATUS_LABEL[s] || s}</option>`).join('')}</select>
      <input type="date" id="h-from" value="${esc(S.histFrom)}" title="From"> <input type="date" id="h-to" value="${esc(S.histTo)}" title="To">
      <button class="btn" id="h-apply">Apply</button>
      <button class="btn" id="h-csv">Export CSV</button>
    </div>
    <p style="color:var(--muted);font-size:13.5px;margin-bottom:10px">${list.length} orders shown · ${money(sales)} (excl. cancelled)${S.histDone ? '' : ' · more available'}</p>
    <div class="list">${list.map(o => orderCard(o, { date: true })).join('') || '<p class="empty">No orders match.</p>'}</div>
    ${S.histDone ? '' : '<div class="pager"><button class="btn" id="h-more">Load older orders</button></div>'}`;
  $('#h-q').addEventListener('input', e => { S.histQ = e.target.value; clearTimeout(renderHistory._t); renderHistory._t = setTimeout(renderHistory, 250); });
  $('#h-status').addEventListener('change', e => { S.histStatus = e.target.value; renderHistory(); });
  $('#h-apply').addEventListener('click', async () => { S.histFrom = $('#h-from').value; S.histTo = $('#h-to').value; await loadHistory(true); renderHistory(); });
  $('#h-more')?.addEventListener('click', async () => { await loadHistory(false); renderHistory(); });
  $('#h-csv').addEventListener('click', () => exportCsv(histFiltered()));
}
function exportCsv(list) {
  const cols = ['id', 'placedAt', 'status', 'mode', 'outlet', 'name', 'phone', 'address', 'items', 'subtotal', 'tax', 'delivery', 'total', 'payMethod', 'payStatus', 'utr', 'note'];
  const rows = list.map(o => [o.id, new Date(o.placedAt).toLocaleString('en-IN'), o.status, o.mode, o.outlet, o.name, o.phone, o.address, (o.items || []).map(i => i.qty + 'x ' + i.name).join('; '), o.subtotal, o.tax, o.delivery, o.total, (o.payment || {}).method, (o.payment || {}).status, (o.payment || {}).utr, o.note]);
  const csv = [cols, ...rows].map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' })); a.download = 'balaji-orders-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
}

/* ───────── view: customers ───────── */
async function loadCustomers() {
  try {
    const snap = await getDocs(query(collection(db, 'customers'), orderBy('lastOrderAt', 'desc'), limit(400)));
    S.customers = []; snap.forEach(d => S.customers.push(Object.assign({ _id: d.id }, d.data())));
  } catch (err) { toast('Could not load customers: ' + (err.code || err.message)); }
  /* also fold in anyone who ordered but has no customer doc yet (older orders) */
  const have = new Set(S.customers.map(c => c.phone));
  const extra = new Map();
  [...S.orders.values(), ...S.history].forEach(o => {
    const ph = String(o.phone || '').replace(/\D/g, '').slice(-10); if (ph.length !== 10 || have.has(ph)) return;
    const c = extra.get(ph) || { _id: ph, phone: ph, name: o.name, orders: 0, spend: 0, lastOrderAt: 0, lastAddress: '', derived: true };
    c.orders++; c.spend += Number(o.total) || 0; if ((o.placedAt || 0) > c.lastOrderAt) { c.lastOrderAt = o.placedAt; c.name = o.name || c.name; c.lastAddress = o.address || c.lastAddress; }
    extra.set(ph, c);
  });
  S.customers = [...S.customers, ...extra.values()].sort((a, b) => (b.lastOrderAt || 0) - (a.lastOrderAt || 0));
}

  $('#a-add').addEventListener('click', async () => { const em = $('#a-email').value.trim().toLowerCase(); if (!/.+@.+\..+/.test(em)) { toast('Enter a valid email'); return; } try { await setDoc(doc(db, 'admins', em), { role: 'staff', addedBy: S.user.email, addedAt: Date.now() }); $('#a-email').value = ''; toast('Added — now create that login in Firebase Authentication'); loadAdmins(); } catch (err) { toast('Failed: ' + err.message); } });
}

/* ───────── modal ───────── */
function openModal(html) { const d = $('#modal'); $('#modal-body').innerHTML = html; if (!d.open) d.showModal(); $('#modal-body [data-close]')?.addEventListener('click', () => d.close()); }
$('#modal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

/* ───────── print (KOT / bill) ───────── */
function printOrder(o) {
  const p = o.payment || {};
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(o.id)}</title><style>
    body{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;width:72mm;margin:0 auto;padding:6mm 3mm;color:#000}
    h1{font-size:17px;text-align:center;margin:0}h2{font-size:12px;text-align:center;font-weight:400;margin:2px 0 8px}
    .big{font-size:22px;font-weight:700;text-align:center;margin:6px 0}
    table{width:100%;border-collapse:collapse}td{padding:2px 0;vertical-align:top}td:last-child{text-align:right}
    hr{border:0;border-top:1px dashed #000;margin:6px 0}.tot td{font-weight:700;font-size:15px}.c{text-align:center}.note{border:1px dashed #000;padding:4px;margin:6px 0}
  </style></head><body>
    <h1>BALAJI PAUVA HOUSE</h1><h2>${esc(o.outlet || '')} · ${SHOP_PHONE}</h2>
    <div class="big">#${esc(shortId(o.id))}</div>
    <div class="c">${esc(o.id)} · ${dateStr(o.placedAt)} ${clock(o.placedAt)}</div>
    <div class="c"><b>${o.mode === 'pickup' ? 'PICKUP' : 'DELIVERY'}</b> · ${p.method === 'upi' ? (p.status === 'paid' ? 'PAID (UPI)' : 'UPI – NOT PAID') : (p.status === 'paid' ? 'PAID (CASH)' : (o.mode === 'pickup' ? 'PAY AT COUNTER' : 'COD – COLLECT ' + money(o.total)))}</div>
    <hr><div><b>${esc(o.name || 'Guest')}</b> · ${esc(fmtPhone(o.phone))}</div>${o.mode === 'delivery' && o.address ? '<div>' + esc(o.address) + '</div>' : ''}
    ${o.note ? '<div class="note">NOTE: ' + esc(o.note) + '</div>' : ''}<hr>
    <table>${(o.items || []).map(i => `<tr><td>${esc(i.qty)} x ${esc(i.name)}</td><td>${money((i.price || 0) * i.qty)}</td></tr>`).join('')}</table><hr>
    <table><tr><td>Subtotal</td><td>${money(o.subtotal)}</td></tr><tr><td>GST 5%</td><td>${money(o.tax)}</td></tr>${o.delivery ? `<tr><td>Delivery</td><td>${money(o.delivery)}</td></tr>` : ''}${o.roundOff ? `<tr><td>Round off</td><td>${Number(o.roundOff).toFixed(2)}</td></tr>` : ''}<tr class="tot"><td>TOTAL</td><td>${money(o.total)}</td></tr></table>
    <hr><div class="c">Thank you! Fresh flavours, happy mornings.</div>
  </body></html>`;
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  f.contentDocument.open(); f.contentDocument.write(html); f.contentDocument.close();
  setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (_) {} setTimeout(() => f.remove(), 2000); }, 250);
}

try { if ('wakeLock' in navigator) { const req = () => navigator.wakeLock.request('screen').catch(() => {}); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') req(); }); req(); } } catch (_) {}
window.addEventListener('online', () => setConn(true)); window.addEventListener('offline', () => setConn(false));

try { if (localStorage.getItem('bph-debug') === '1') window.__bph = { S, renderLive, renderHistory, renderCustomers, renderSettings, orderCard, setView }; } catch (_) {}
